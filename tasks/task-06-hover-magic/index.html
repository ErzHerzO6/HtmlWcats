<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Magic — Pet the Cats!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =========================================================
       TASK 6: HOVER EFFECTS & SMOOTH TRANSITIONS
       Right now, moving your mouse over these cards and buttons
       feels completely static and lifeless.
       Open style.css to make the cards gently float upward and
       buttons react smoothly when hovered or clicked!
       ========================================================= -->

  <main class="container">
    <h1>Move Your Mouse Over a Cat! ✨</h1>
    <p class="subtitle">Good frontend feels alive when you interact with it.</p>

    <div class="cards-row">
      <article class="cat-card">
        <div class="photo-frame">
          <img class="cat-photo" src="../../assets/mochi.svg" alt="Mochi">
        </div>
        <h2>Mochi</h2>
        <p>Hover over my card to see me float, and click the button below!</p>
        <button class="pet-btn">👋 Give Head Scritches</button>
      </article>

      <article class="cat-card">
        <div class="photo-frame">
          <img class="cat-photo" src="../../assets/luna.svg" alt="Luna">
        </div>
        <h2>Luna</h2>
        <p>Notice how `transition` makes movement smooth instead of jerky!</p>
        <button class="pet-btn">🐟 Offer Salmon Treat</button>
      </article>
    </div>
  </main>

  <!-- Floating Task Checklist -->
  <script src="../../task-guide.js" data-task="6"></script>
</body>
</html>
