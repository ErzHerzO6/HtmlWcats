<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sir Whiskers — Adoption Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =========================================================
       TASK 4: THE CSS BOX MODEL ("A CAT IN A CARDBOARD BOX")
       The HTML below is already complete!
       Open style.css to turn this plain unstyled block into a
       sleek, modern Cat Adoption Card!
       ========================================================= -->

  <article class="cat-card">
    <img class="cat-photo" src="../../assets/whiskers.svg" alt="Sir Whiskers wearing a red bowtie">

    <span class="badge">Available for Cuddles</span>

    <h1 class="cat-name">Sir Whiskers</h1>
    <p class="cat-role">Distinguished Tuxedo Gentleman &bull; 4 Years Old</p>

    <p class="cat-bio">
      Always dressed for a gala. Demands chin scratches at 8:00 AM sharp and judges
      your posture while you work from home.
    </p>

    <button class="adopt-btn">Apply to Adopt Sir Whiskers</button>
  </article>

  <!-- Floating Task Checklist -->
  <script src="../../task-guide.js" data-task="4"></script>
</body>
</html>
