<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="Barnaby the orange tabby cat">
  <defs>
    <linearGradient id="bgBarnaby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7E0"/>
      <stop offset="100%" stop-color="#FFE8B3"/>
    </linearGradient>
  </defs>
  <rect width="320" height="260" rx="24" fill="url(#bgBarnaby)"/>
  <ellipse cx="152" cy="224" rx="82" ry="14" fill="#E9CB8B"/>
