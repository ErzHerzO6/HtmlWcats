  <line x1="80" y1="122" x2="108" y2="122" stroke="#4A2C11" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="226" y1="110" x2="200" y2="114" stroke="#4A2C11" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="228" y1="122" x2="200" y2="122" stroke="#4A2C11" stroke-width="2.5" stroke-linecap="round"/>
