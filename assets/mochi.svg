<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="Mochi the calico cat">
  <defs>
    <linearGradient id="bgMochi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3E4"/>
      <stop offset="100%" stop-color="#FFE2CC"/>
    </linearGradient>
  </defs>
  <rect width="320" height="260" rx="24" fill="url(#bgMochi)"/>
  <!-- Soft floor shadow -->
  <ellipse cx="160" cy="224" rx="78" ry="14" fill="#EAC5AC"/>
  <!-- Sparkles -->
  <path d="M58 58 L62 70 L74 74 L62 78 L58 90 L54 78 L42 74 L54 70 Z" fill="#F4A261"/>
  <path d="M262 48 L265 56 L273 59 L265 62 L262 70 L259 62 L251 59 L259 56 Z" fill="#E76F51"/>
  <!-- Tail -->
  <path d="M212 204 C252 204, 268 164, 246 144 C232 132, 224 150, 232 162 C238 172, 228 188, 206 190" fill="none" stroke="#3D312E" stroke-width="16" stroke-linecap="round"/>
  <circle cx="244" cy="148" r="9" fill="#E76F51"/>
  <!-- Body -->
  <ellipse cx="160" cy="176" rx="56" ry="48" fill="#FFFDF9" stroke="#3D312E" stroke-width="4"/>
  <!-- Calico patches on body -->
  <path d="M192 142 C214 156, 218 186, 198 206 C186 192, 182 166, 192 142 Z" fill="#E76F51"/>
  <ellipse cx="122" cy="174" rx="18" ry="24" fill="#4A3B37"/>
  <!-- Ears -->
  <polygon points="106,96 98,42 142,68" fill="#E76F51" stroke="#3D312E" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="112,86 107,54 134,70" fill="#FFD6CC"/>
  <polygon points="214,96 222,42 178,68" fill="#4A3B37" stroke="#3D312E" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="208,86 213,54 186,70" fill="#FFD6CC"/>
  <!-- Head -->
  <ellipse cx="160" cy="108" rx="58" ry="48" fill="#FFFDF9" stroke="#3D312E" stroke-width="4"/>
  <!-- Calico patches on head -->
  <path d="M104 96 C106 70, 130 60, 152 62 C146 84, 128 98, 104 96 Z" fill="#E76F51"/>
  <path d="M215 98 C214 72, 194 62, 174 64 C180 86, 196 98, 215 98 Z" fill="#4A3B37"/>
  <!-- Eyes -->
  <circle cx="138" cy="108" r="8" fill="#2D2424"/>
  <circle cx="182" cy="108" r="8" fill="#2D2424"/>
  <circle cx="135" cy="105" r="3" fill="#FFFFFF"/>
  <circle cx="179" cy="105" r="3" fill="#FFFFFF"/>
  <!-- Rosy cheeks -->
  <ellipse cx="120" cy="120" rx="10" ry="6" fill="#FFB5A7" opacity="0.75"/>
  <ellipse cx="200" cy="120" rx="10" ry="6" fill="#FFB5A7" opacity="0.75"/>
  <!-- Nose & Mouth -->
  <polygon points="155,116 165,116 160,122" fill="#F28482"/>
  <path d="M160 122 Q153 130 146 125" fill="none" stroke="#3D312E" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 122 Q167 130 174 125" fill="none" stroke="#3D312E" stroke-width="3" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="88" y1="110" x2="112" y2="114" stroke="#3D312E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="86" y1="122" x2="112" y2="122" stroke="#3D312E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="232" y1="110" x2="208" y2="114" stroke="#3D312E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="234" y1="122" x2="208" y2="122" stroke="#3D312E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Collar -->
  <path d="M120 146 Q160 160 200 146" fill="none" stroke="#E76F51" stroke-width="7" stroke-linecap="round"/>
  <circle cx="160" cy="156" r="7" fill="#F4C430" stroke="#3D312E" stroke-width="2.5"/>
  <!-- Paws -->
  <ellipse cx="138" cy="218" rx="16" ry="10" fill="#FFFDF9" stroke="#3D312E" stroke-width="3.5"/>
  <ellipse cx="182" cy="218" rx="16" ry="10" fill="#FFFDF9" stroke="#3D312E" stroke-width="3.5"/>
</svg>
