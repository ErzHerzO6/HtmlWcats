<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1. The <title> appears in the browser tab -->
  <title>Meet Mochi the Cat!</title>
</head>
<body>

  <!-- 2. Main page heading (only use one <h1> per page!) -->
  <h1>Meet Mochi!</h1>

  <!-- 3. Image tag: src tells the browser WHERE the image is, alt describes it -->
  <img src="../../assets/mochi.svg" alt="Mochi the calico cat" width="260">

  <!-- 4. Paragraph with <strong> (bold importance) and <em> (italic emphasis) -->
  <p>
    Mochi is a <strong>professional napper</strong> and a friendly calico cat who believes
    every cardboard box belongs to <em>her</em>.
  </p>

  <!-- 5. Subheading for a new topic -->
  <h2>Mochi's Favorite Snacks</h2>

  <!-- 6. Unordered (bullet) list with 3 list items -->
  <ul>
    <li>Crispy salmon treats</li>
    <li>Steamed chicken</li>
    <li>Anything currently on your plate</li>
  </ul>

  <!-- 7. Anchor link opening in a new tab -->
  <p>
    Curious about her coat colors?
    <a href="https://en.wikipedia.org/wiki/Calico_cat" target="_blank">
      Learn more about Calico Cats
    </a>
  </p>

</body>
</html>
